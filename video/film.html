<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Gode Tekster – introfilm</title>
<!--
  Introfilm til Gode Tekster (60 sek., LinkedIn). Én fil, intet net.
  Brug:  film.html?format=1x1        afspiller i browseren (kun til gennemsyn)
         film.html?format=16x9&t=12  viser præcis billedet til tiden 12 sek.
  Alt tegnes af seek(t). Intet afhænger af uret, så render.mjs får samme billede hver gang.
  Lyden laves ikke her: render.mjs henter FILM.events (tastetryk, linjeskift, sceneskift)
  og syntetiserer lydsporet ud fra de samme tider, som tegningen bruger.
  Skrifterne ligger som base64 nederst i filen (ASSETS).
-->
<style>
  html, body { margin: 0; height: 100%; background: #f7f7f7; overflow: hidden; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const DUR = 60, FPS = 30;
const C = {
  bg: '#f7f7f7', ink: '#2b2b2b', soft: '#6b6b6b', dim: '#8f8f8f', pynt: '#c4c4c4', line: '#dcdcdc', white: '#ffffff',
  blue: '#1aa3ff', mark: '#cde9fd', fund: '#fff1b8', red: '#db5230', n: '#a84a23', v: '#17698f',
};
// To formater af de samme scener. split = tegning og tekst hver for sig, flip = byttet om.
const LAYOUT = {
  '1x1': { W: 1080, H: 1080, m: 90, head: 50, headLH: 64, sub: 40, subLH: 54, gap: 30, wm: 26, wmY: 104,
    split: { cap: { x: 90, y: 700 }, pic: { x: 90, y: 185, w: 900, h: 430 } },
    flip:  { cap: { x: 90, y: 190 }, pic: { x: 90, y: 530, w: 900, h: 430 } } },
  '16x9': { W: 1920, H: 1080, m: 130, head: 64, headLH: 82, sub: 44, subLH: 60, gap: 36, wm: 28, wmY: 108,
    split: { cap: { x: 130, y: null }, pic: { x: 1040, y: 230, w: 770, h: 620 } },
    flip:  { cap: { x: 960, y: null }, pic: { x: 130, y: 230, w: 740, h: 620 } } },
};
const params = new URLSearchParams(location.search);
const FORMAT = params.get('format') === '16x9' ? '16x9' : '1x1';
const L = LAYOUT[FORMAT];
const is169 = FORMAT === '16x9';
const canvas = document.getElementById('c');
canvas.width = L.W; canvas.height = L.H;
const ctx = canvas.getContext('2d');
const MONO = 'GTMono', SERIF = 'GTSerif';

/* ---------- små hjælpere ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeIn = (p) => p * p * p;
const easeIO = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
function hash(i, s) {
  let x = Math.imul(i + 1, 2654435761) ^ Math.imul(s + 7, 1597334677);
  x ^= x >>> 15; x = Math.imul(x, 2246822519); x ^= x >>> 13;
  return ((x >>> 0) % 10000) / 10000;
}
function mix(c1, c2, p) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = (sh) => Math.round(lerp((a >> sh) & 255, (b >> sh) & 255, p));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function alpha(a, fn) { if (a <= 0) return; const p = ctx.globalAlpha; ctx.globalAlpha = p * clamp(a); fn(); ctx.globalAlpha = p; }
function rect(x, y, w, h, col) { if (w <= 0 || h <= 0) return; ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function line(x1, y1, x2, y2, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function box(x, y, w, h, col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.strokeRect(x, y, w, h); }
function font(size, weight, fam) { ctx.font = `${weight || 400} ${size}px ${fam || MONO}`; ctx.textBaseline = 'alphabetic'; }
function text(s, x, y, size, col, weight, fam) { font(size, weight, fam); ctx.fillStyle = col; ctx.fillText(s, x, y); }
function adv(size, weight) { font(size, weight); return ctx.measureText('0').width; }

/* ---------- scenernes tider og overgange ---------- */
// 11 scener. TR[i] er overgangen fra scene i til i+1:
// feed = papiret rykker op, side = vognen rykker til siden, wipe = en streg kører hen over
// billedet som en vognretur, cut = hårdt klip.
const T = [0, 7.5, 14.0, 18.4, 22.8, 28.1, 33.7, 38.3, 43.5, 48.7, 54.5, 60];
const N = T.length - 1;
const TR = ['feed', 'wipe', 'side', 'feed', 'wipe', 'side', 'feed', 'cut', 'wipe', 'feed'];

/* ---------- skrevet tekst: tiderne styrer både tegning og lyd ---------- */
const EVENTS = [];
let typedSeed = 0;
function makeTyped(lines, t0, cps, vol) {
  const seed = ++typedSeed, times = [], returns = [];
  let t = t0, n = 0;
  lines.forEach((ln, li) => {
    if (li > 0) { returns.push(t + 0.04); EVENTS.push({ t: t + 0.04, k: 'return', v: vol }); t += 0.32; }
    const arr = [];
    for (let i = 0; i < ln.length; i++) {
      const ch = ln[i];
      arr.push(t);
      EVENTS.push({ t, k: ch === ' ' ? 'space' : 'key', v: vol, pan: (i / Math.max(1, ln.length - 1) - 0.5) * 0.5, s: seed * 1000 + n });
      t += (1 / cps) * (0.7 + 0.6 * hash(n, seed)) + (ch === ',' || ch === '.' ? 0.1 : 0);
      n++;
    }
    times.push(arr);
  });
  return { lines, times, returns, t0, end: t };
}
// Tegner teksten til tiden t. caret = [fra, til] i filmtid, eller null.
function drawTyped(it, t, x, y, size, weight, col, lh, caret) {
  const a = adv(size, weight);
  ctx.fillStyle = col;
  let cx = x, cy = y;
  for (let li = 0; li < it.lines.length; li++) {
    const arr = it.times[li];
    let n = 0; while (n < arr.length && arr[n] <= t) n++;
    if (n > 0) ctx.fillText(it.lines[li].slice(0, n), x, y + li * lh);
    if (arr[0] <= t) {
      cx = x + n * a; cy = y + li * lh;
      // Vognretur: markøren glider tilbage til næste linjes begyndelse.
      if (n === arr.length && li < it.lines.length - 1) {
        const p = easeIO(prog(t, it.returns[li], it.times[li + 1][0] - 0.03));
        cx = lerp(cx, x, p); cy = lerp(cy, y + (li + 1) * lh, p);
      }
    }
  }
  if (caret && t >= caret[0] && t < caret[1]) {
    const typing = t >= it.t0 && t < it.end + 0.15;
    const ref = t < it.t0 ? t : t - it.end;
    if (typing || (((ref % 1.0) + 1.0) % 1.0) < 0.55) rect(cx + size * 0.06, cy - size * 0.84, Math.max(3, size * 0.075), size * 1.06, C.blue);
  }
}

/* ---------- teksterne ---------- */
// Scene 1: to slag.
const S1A = makeTyped(is169 ? ['Endelig et skriveprogram,', 'der giver dig ro til at skrive.'] : ['Endelig et skriveprogram,', 'der giver dig ro', 'til at skrive.'], 0.4, 24, 1);
const S1B = makeTyped(['Fordi Gode Medier kræver', 'Gode Tekster.'], Math.max(S1A.end + 0.7, 4.0), 24, 1);
// Scene 2: essensen.
const S2A = makeTyped(is169 ? ['Rolig skriveflade uden for mange valg,', 'der distraherer.'] : ['Rolig skriveflade uden for', 'mange valg, der distraherer.'], T[1] + 0.5, 28, 1);
const S2B = makeTyped(['Og fokus på det vigtige.'], T[1] + 4.3, 24, 1);

// ---------- Scene 5: egne kommandoer med / ----------
// SKIFT NAVNENE HER, hvis startbiblioteket ændrer sig, og kør render.mjs igen.
// typed skal være begyndelsen af præcis én kommando. Den kommando bliver valgt og sat ind.
const SLASH = {
  commands: ['/interview', '/faktaboks', '/dato', '/kilde'],
  typed: '/int',                 // det, der bliver tastet i teksten
  title: 'Interview',            // overskriften i skabelonen, der lander
  dateLabel: 'Dato',
  date: '5. oktober 2026',       // feltet, der bliver udfyldt
};
// Tider i sekunder inde i scenen. keys har én tid pr. tegn i SLASH.typed.
const SLASH_T = { keys: [1.75, 2.4, 2.62, 2.84].slice(0, SLASH.typed.length), enter: 3.3, date: 3.8, dateStep: 0.055 };

// ---------- Scene 9: alle de andre funktioner, i den rækkefølge de lander ----------
const FUNCTIONS = ['Ro på (F11)', 'Stavekontrol', 'Versioner', 'Fodnoter', 'Disposition', 'Fokus på afsnittet',
  'Noter til dig selv', 'Print og PDF', 'Gem som Word', 'Åbner Word-filer', 'Renskriv interviewnoter', 'Stiltjek og LIX',
  'Lister med a) b) c)', 'Stjerner i biblioteket', 'Søg i alle tekster', 'Dansk og engelsk', 'Opdaterer sig selv', 'Gratis'];
const GRID_T = { first: 1.05, step: 0.115 };

// ---------- Scene 10: teksten, der bliver skrevet i skrivemaskinetilstand ----------
// Ordret fra toppen af teksten »Mit nye inputapparat: En forelskelse«.
const TYPE_TEXT = [
  { t: 'Mit nye inputapparat: En forelskelse', bold: true },
  { t: 'Om glæden ved et tastatur, der siger KLANK! KLANK! KLANK!', bold: true },
  { t: 'Jeg tog mig selv i at researche på østtyske skrivemaskiner.' },
  { t: 'Meningen var ellers, at jeg skulle skrive en bog. Nu sad jeg og læste om forskellen på en Erika Daro og en Olympia SM9. Plusser og minusser, kvalitet versus pris.' },
  { t: 'Mens jeg altså ikke skrev noget, læste jeg om farvebånd og gummiruller og papirvalser. Om forhandleren på Ndr. Frihavnsgade, der stadig sælger den slags. Det er afgørende at vælge en model, der stadig er til at servicere. Man må ikke undervurdere vigtigheden af reservedele.' },
  { t: 'Det er meget romantisk at kigge på gamle maskiner. Prøv selv, tag et kig på en ægte skrivemaskine. Hemingway træder frem for dit indre. Russiske forfattere. Du ser pludselig dit skrivebord i sepia.' },
];
const TYPE_S0 = 0.75, TYPE_CPS = 105;

function cap(i, head, sub) {
  const h = makeTyped(head, T[i] + 0.5, 26, 1);
  // Underteksten skrives ikke. Den toner frem linje for linje, så den kan læses med det samme.
  return { head: h, sub, subT: sub ? h.end + 0.3 : 0, caretEnd: T[i + 1] };
}
const SC = [
  { kind: 'intro' },
  { kind: 'essence' },
  { kind: 'std', lay: 'split', pic: 'daemp', cap: cap(2, is169 ? ['Dæmp i stedet', 'for at slette'] : ['Dæmp i stedet for at slette'], ['Er du i tvivl om en sætning,', 'dæmper du den bare.']) },
  { kind: 'std', lay: 'flip', pic: 'fraklip', cap: cap(3, is169 ? ['Træk tekst over', 'i fraklip'] : ['Træk tekst over i fraklip'], ['Så kan du altid trække det', 'tilbage igen.']) },
  { kind: 'std', lay: 'split', pic: 'slash', cap: cap(4, is169 ? ['Dine egne', 'kommandoer med /'] : ['Dine egne kommandoer med /'], ['Skabeloner og genveje,', 'du selv bestemmer.']) },
  { kind: 'std', lay: 'split', pic: 'files', cap: cap(5, is169 ? ['Teksterne er', 'almindelige filer'] : ['Teksterne er almindelige filer'], ['Kan åbnes af alt fra Notesblok', 'til Word. Og optimeret til at', 'blive forstået af din chatbot.']) },
  { kind: 'std', lay: 'flip', pic: 'ordklasser', cap: cap(6, ['Se, hvordan teksten', 'er skruet sammen'], ['Ordklasser i farver', 'og et stiltjek med LIX.']) },
  { kind: 'std', lay: 'split', pic: 'fakta', cap: cap(7, ['Faktatjek med kilder,', 'du selv kan åbne'], ['Kører på dit eget abonnement', 'på Claude, ChatGPT eller Gemini.']) },
  { kind: 'grid' },
  { kind: 'std', lay: 'split', pic: 'type', cap: cap(9, ['Programmet skriver', 'aldrig for dig'], ['At skrive er at tænke.', 'Det skal vi værne om.']) },
  { kind: 'end' },
];
const S9H = makeTyped(['Og alt det andet'], T[8] + 0.2, 26, 1);
const S11 = makeTyped(['Gode Tekster'], T[10] + 0.6, 11, 1);

/* ---------- lyde, der ikke er overskrifter ---------- */
TR.forEach((tr, i) => {
  if (tr === 'feed' || tr === 'side') EVENTS.push({ t: T[i + 1] - 0.12, k: 'scene' });
  if (tr === 'wipe') EVENTS.push({ t: T[i + 1] - 0.28, k: 'return', v: 0.8 });
});
// Scene 2: tre bløde dunk, når panelerne falder væk.
[2.45, 2.75, 3.05].forEach((s, k) => EVENTS.push({ t: T[1] + s, k: 'space', v: 0.5, pan: [-0.4, 0.4, 0][k], s: 8000 + k }));
// Scene 5: det, der tastes efter /, Enter og datoen, der bliver udfyldt.
SLASH_T.keys.forEach((kt, k) => EVENTS.push({ t: T[4] + kt, k: 'key', v: 0.75, pan: -0.2, s: 9000 + k }));
EVENTS.push({ t: T[4] + SLASH_T.enter, k: 'space', v: 1, pan: 0, s: 9100 });
for (let k = 0; k < SLASH.date.length; k += 2) EVENTS.push({ t: T[4] + SLASH_T.date + k * SLASH_T.dateStep, k: 'soft', v: 0.6, pan: -0.1, s: 9200 + k });
// Scene 9: ét dunk pr. funktion, der lander.
FUNCTIONS.forEach((f, k) => EVENTS.push({ t: T[8] + GRID_T.first + k * GRID_T.step, k: 'key', v: 0.6, pan: ((k % 3) - 1) * 0.35, s: 9400 + k }));
// Scene 10: en jævn, blød trommen, mens teksten flyver ind. Ikke ét slag pr. tegn.
for (let k = 0, s = TYPE_S0; s < T[10] - T[9] - 0.5; k++, s += 0.058 + 0.03 * hash(k, 77)) EVENTS.push({ t: T[9] + s, k: 'soft', v: 0.5 + 0.3 * hash(k, 78), pan: (hash(k, 79) - 0.5) * 0.4, s: 9600 + k });
EVENTS.push({ t: S11.end + 0.35, k: 'tone', f: 392 });
EVENTS.sort((a, b) => a.t - b.t);

/* ---------- tegningerne ---------- */
function inPic(b, fn, dw = 900, dh = 430) {
  const s = Math.min(b.w / dw, b.h / dh);
  ctx.save();
  ctx.translate(b.x + (b.w - dw * s) / 2, b.y + (b.h - dh * s) / 2);
  ctx.scale(s, s); fn(); ctx.restore();
}
// Rækker af »tekst« som streger. Vokser frem fra venstre, én linje ad gangen.
function grow(s, i) { return easeOut(prog(s, 0.2 + i * 0.11, 0.75 + i * 0.11)); }
let TW = null;
function typeLines() {
  if (TW) return TW;
  const out = []; let idx = 0, pause = 0;
  TYPE_TEXT.forEach((b, bi) => {
    if (bi > 0) { pause += 0.07; out.push({ text: '', start: idx, pause }); }
    font(40, b.bold ? 700 : 400, SERIF);
    let ln = '';
    const push = () => { out.push({ text: ln, bold: b.bold, start: idx, pause }); idx += ln.length + 1; };
    b.t.split(' ').forEach((w) => { const test = ln ? ln + ' ' + w : w; if (ln && ctx.measureText(test).width > 850) { push(); ln = w; } else ln = test; });
    push();
  });
  out.forEach((l) => { l.time = TYPE_S0 + l.start / TYPE_CPS + l.pause; });
  return (TW = out);
}

const PIC = {
  // Dæmp. En sætning midt i teksten markeres og bliver lysegrå.
  daemp(s) {
    const W = [820, 760, 800, 690, 780, 520], x0 = 40, h = 20;
    const y = (i) => 44 + i * 62;
    const a1 = [470, 840], a2 = [40, 510];
    const tot = (a1[1] - a1[0]) + (a2[1] - a2[0]);
    const sel = easeIO(prog(s, 1.4, 2.1)) * tot, selA = 1 - prog(s, 2.8, 3.2);
    const dimP = easeIO(prog(s, 2.1, 2.8));
    alpha(selA, () => {
      rect(a1[0] - 6, y(2) - 12, Math.min(sel, a1[1] - a1[0]) + (sel > 0 ? 12 : 0), h + 24, C.mark);
      const r2 = sel - (a1[1] - a1[0]);
      if (r2 > 0) rect(a2[0] - 6, y(3) - 12, r2 + 12, h + 24, C.mark);
    });
    W.forEach((w, i) => {
      const g = grow(s, i), end = x0 + w * g;
      if (i === 2) { rect(x0, y(i), Math.min(end, 456) - x0, h, C.ink); rect(a1[0], y(i), Math.min(end, a1[1]) - a1[0], h, mix(C.ink, C.pynt, dimP)); }
      else if (i === 3) { rect(a2[0], y(i), Math.min(end, a2[1]) - a2[0], h, mix(C.ink, C.pynt, dimP)); rect(524, y(i), end - 524, h, C.ink); }
      else rect(x0, y(i), end - x0, h, C.ink);
    });
  },
  // Fraklip. To linjer trækkes over i en rude til højre og tilbage igen.
  fraklip(s) {
    const W = [540, 500, 520, 460, 530, 380], x0 = 20, h = 20;
    const y = (i) => 44 + i * 62;
    const p = easeIO(prog(s, 1.3, 2.1)) - easeIO(prog(s, 3.0, 3.8));
    alpha(prog(s, 0.3, 0.9), () => {
      box(640, 22, 250, 388, C.pynt, 3);
      line(640, 84, 890, 84, C.pynt, 3);
      text('Fraklip', 660, 64, 28, C.soft, 400);
    });
    W.forEach((w, i) => {
      const g = grow(s, i);
      if (i === 2 || i === 3) {
        const k = i - 2;
        rect(lerp(x0, 662, p), lerp(y(i), 116 + k * 40, p), lerp(w * g, w * 0.4, p), lerp(h, 14, p), mix(C.ink, C.soft, p));
      } else rect(x0, y(i) - (i > 3 ? 124 * p : 0), w * g, h, C.ink);
    });
  },
  // Egne kommandoer. Der tastes /, en liste åbner og snævrer ind, Enter sætter en skabelon ind.
  slash(s) {
    const x0 = 40, base = 172, size = 40, a = adv(size, 400);
    rect(x0, 30, 760 * grow(s, 0), 20, C.ink); rect(x0, 86, 620 * grow(s, 1), 20, C.ink);
    const K = SLASH_T.keys, E = SLASH_T.enter;
    let n = 0; while (n < K.length && K[n] <= s) n++;
    const typed = SLASH.typed.slice(0, n);
    if (s < E) {
      if (n) text(typed, x0, base, size, C.ink, 400);
      if (s > 0.7 && (n ? (s - K[n - 1] < 0.2 || ((s - K[n - 1]) % 1.0) < 0.55) : ((s - 0.7) % 1.0) < 0.55)) rect(x0 + n * a + 3, base - 34, 4, 43, C.blue);
      // Listen: rækker, der ikke passer til det tastede, klapper sammen.
      const open = easeOut(prog(s, K[0] + 0.08, K[0] + 0.45));
      if (open > 0) {
        const rowH = 54, w = 420, top = base + 20 + (1 - open) * 14;
        const hs = SLASH.commands.map((c) => {
          let gone = 0;
          for (let i = 1; i < K.length; i++) if (!c.startsWith(SLASH.typed.slice(0, i + 1))) { gone = easeIO(prog(s, K[i] + 0.05, K[i] + 0.4)); break; }
          return 1 - gone;
        });
        const total = hs.reduce((p, v) => p + v * rowH, 0);
        alpha(open, () => {
          rect(x0, top, w, total, C.white);
          let y = top, first = true;
          SLASH.commands.forEach((c, i) => {
            const hh = hs[i] * rowH; if (hh < 1) return;
            if (first) { rect(x0, y, w, hh, C.mark); first = false; }
            alpha(hs[i] * hs[i], () => text(c, x0 + 18, y + hh / 2 + 11, 32, C.ink, 400));
            y += hh;
          });
          box(x0, top, w, total, C.pynt, 3);
        });
      }
    } else {
      // Skabelonen lander: overskrift, et datofelt der bliver udfyldt, og tomme linjer.
      const p = easeOut(prog(s, E + 0.05, E + 0.5));
      ctx.save(); ctx.translate(0, (1 - p) * 16);
      alpha(p, () => {
        text(SLASH.title, x0, base, size, C.ink, 700);
        text(SLASH.dateLabel, x0, base + 64, 32, C.soft, 400);
        const dx = x0 + (SLASH.dateLabel.length + 2) * adv(32, 400);
        const dn = clamp(Math.floor((s - SLASH_T.date) / SLASH_T.dateStep) + 1, 0, SLASH.date.length);
        if (dn > 0) text(SLASH.date.slice(0, dn), dx, base + 64, 32, C.ink, 400);
        if (s > E + 0.5 && (dn < SLASH.date.length || ((s - SLASH_T.date) % 1.0) < 0.55)) rect(dx + dn * adv(32, 400) + 3, base + 64 - 27, 4, 35, C.blue);
        [[110, 520], [166, 440], [222, 600]].forEach(([dy, w], i) => {
          const g = easeOut(prog(s, E + 0.3 + i * 0.12, E + 0.8 + i * 0.12));
          rect(x0, base + dy, 96 * g, 16, C.soft); rect(dx, base + dy, w * g, 16, C.pynt);
        });
      });
      ctx.restore();
    }
  },
  // Filer. Én almindelig fil, og tre steder den kan læses. En prik løber ud ad hver gren.
  files(s) {
    alpha(prog(s, 0.3, 0.8), () => {
      box(40, 120, 104, 134, C.ink, 3);
      [0, 1, 2, 3].forEach((i) => line(60, 152 + i * 24, i === 3 ? 104 : 124, 152 + i * 24, C.ink, 3));
      text('Mit nye inputapparat.md', 40, 304, 30, C.ink, 400);
    });
    const names = ['Notesblok', 'Word', 'Din chatbot'], ys = [70, 187, 304];
    const sx = 144, sy = 187, mx = 490, ex = 560;
    ys.forEach((y, i) => {
      const p = easeIO(prog(s, 1.0 + i * 0.45, 1.65 + i * 0.45));
      if (p <= 0) return;
      const pts = [[sx, sy], [mx, sy], [mx, y], [ex, y]];
      const lens = [mx - sx, Math.abs(y - sy), ex - mx], total = lens[0] + lens[1] + lens[2];
      let d = p * total, hx = sx, hy = sy;

      row.forEach(([w, cls]) => {

  // Faktatjek. En påstand markeres og får kilder, der kan åbnes.

function drawCaption(c, t, lay) {

}

/* ---------- scenerne, der har deres egen opbygning ---------- */
// 1: hele fladen, stor skrift, to slag.
function drawIntro(t) {
  const size = is169 ? 84 : 60, lh = is169 ? 112 : 80, gap = is169 ? 56 : 46;
  const na = S1A.lines.length, nb = S1B.lines.length;

// 2: en flade med paneler og knapper, der falder væk, til kun teksten og markøren står tilbage.
function drawEssence(t) {
  const s = t - T[1];
  const b = is169 ? { x: 130, y: 170, w: 1660, h: 500 } : { x: 90, y: 180, w: 900, h: 440 };
  const dw = b.w, dh = b.h, lp = Math.min(300, dw * 0.22);

    alpha(1 - prog(s, 3.3, 3.9), () => box(0, 0, dw, dh, C.pynt, 3));
    alpha(1 - prog(s, 2.2, 2.6), () => line(0, 54, dw, 54, C.pynt, 3));
    for (let i = 0; i < 9; i++) {      // knapperne falder én ad gangen
      const p = easeIn(prog(s, 1.5 + i * 0.07, 1.95 + i * 0.07));
      const x = i < 6 ? 22 + i * 38 : dw - 42 - (i - 6) * 38;
      alpha(1 - p, () => rect(x, 17 + p * 90, 20, 20, i === 0 ? C.soft : C.pynt));
    }
    let p = easeIn(prog(s, 2.4, 3.0));  // venstre panel
    alpha(1 - p, () => {
      line(lp - p * 140, 54, lp - p * 140, dh - 44, C.pynt, 3);
      [1, 0.7, 0.85, 0.6, 0.8, 0.5].forEach((f, i) => rect(22 - p * 140, 86 + i * 34, (lp - 60) * f, 10, i === 1 ? C.soft : C.pynt));
    });
    p = easeIn(prog(s, 2.7, 3.3));      // højre panel
    alpha(1 - p, () => {
      line(dw - lp + p * 140, 54, dw - lp + p * 140, dh - 44, C.pynt, 3);
      [0, 1, 2].forEach((i) => box(dw - lp + 22 + p * 140, 82 + i * 86, lp - 44, 64, C.pynt, 3));
    });
    p = easeIn(prog(s, 3.0, 3.5));      // statuslinjen
    alpha(1 - p, () => {
      line(0, dh - 44 + p * 60, dw, dh - 44 + p * 60, C.pynt, 3);

    });

    const F = [1, 0.93, 0.97, 0.62, 0.96, 0.45];

      const y = lerp(92 + i * 46, 56 + i * 62, e);
      rect(x0, y, (x1 - x0) * f * grow(s, i), hh, C.ink);

    });

  drawTyped(S2B, t, L.m, y + size * 0.82 + S2A.lines.length * lh, size, 700, C.ink, lh, [S2B.t0 - 0.35, T[2]]);
}

function drawGrid(t) {

  alpha(a, () => {

function render(t) {
  t = clamp(t, 0, DUR);

  rect(0, 0, L.W, L.H, C.bg);
  let cur = 0; while (cur < N - 1 && t >= T[cur + 1]) cur++;
  // Vognretur: en streg kører fra højre mod venstre. Bag den står den næste scene.
  for (let k = 1; k < N; k++) {
    if (TR[k - 1] !== 'wipe' || Math.abs(t - T[k]) >= 0.3) continue;
    const X = Math.round(L.W * (1 - easeIO((t - (T[k] - 0.3)) / 0.6)));
    clipTo(0, 0, X, L.H, () => drawScene(k - 1, t));
    clipTo(X, 0, L.W - X, L.H, () => drawScene(k, t));
    rect(X - 2, 0, 4, L.H, C.ink);
    chrome(t, cur);
    return;
  }
  const tin = cur > 0 ? TR[cur - 1] : 'feed', tout = cur < N - 1 ? TR[cur] : 'none';
  let a = 1, dx = 0, dy = 0;
  if (tin === 'feed' || tin === 'side') { const p = easeOut(prog(t, T[cur], T[cur] + 0.45)); a *= p; if (tin === 'feed') dy += (1 - p) * 34; else dx += (1 - p) * 70; }
  if (tout === 'feed' || tout === 'side') { const p = easeIn(prog(t, T[cur + 1] - 0.4, T[cur + 1])); a *= 1 - p; if (tout === 'feed') dy -= p * 34; else dx -= p * 70; }
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.translate(dx, dy); drawScene(cur, t); ctx.restore();
  chrome(t, cur);
}
window.seek = (t) => { render(Number(t)); return true; };
window.FILM = { DUR, FPS, W: L.W, H: L.H, format: FORMAT, events: EVENTS, scenes: T };

function b64buf(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; }
window.ready = new Promise((resolve) => window.addEventListener('DOMContentLoaded', async () => {
  const A = window.ASSETS;
  for (const [fam, w, k] of [[MONO, '400', 'mono400'], [MONO, '700', 'mono700'], [SERIF, '400', 'serif400'], [SERIF, '700', 'serif700']]) {
    const f = new FontFace(fam, b64buf(A[k]), { weight: w, style: 'normal' });
    await f.load(); document.fonts.add(f);
  }
  if (params.has('t')) render(Number(params.get('t')));
  else {  // gennemsyn i browseren. Uret bruges kun her, aldrig af render.mjs.
    const start = performance.now();
    const loop = () => { render(((performance.now() - start) / 1000) % DUR); requestAnimationFrame(loop); };
    loop();
  }
  resolve(true);
}));
