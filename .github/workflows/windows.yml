# Windows-udgaven bygges her, fra den offentlige kode, og signeres gennem SignPath Foundation
# (gratis kodesignering til open source, ADR-0057). Exe'en signeres først, så installeren pakkes
# om den signerede exe, og til sidst signeres installeren. Hver signering godkendes manuelt i
# SignPath. Uden SIGNPATH_API_TOKEN bygges der usigneret, så bygget kan efterprøves.
#
# Kør: et tag v* (fx v0.2.16) eller »Run workflow« på GitHub.
# Opdateringens minisign-signatur laves ikke her: nøglen bliver hos udgiveren (scripts/udgiv.mjs).

name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Afhængigheder
        run: npm ci

      - name: Byg programmet
        run: npx tauri build --no-bundle

      - name: Gem den usignerede exe
        id: exe
        uses: actions/upload-artifact@v4
        with:
          name: exe-usigneret
          path: src-tauri/target/release/gode-tekster.exe
          if-no-files-found: error

      - name: Signér exe'en (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: gode-tekster
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: signeret-exe

      - name: Læg den signerede exe ind i bygget
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item signeret-exe/gode-tekster.exe src-tauri/target/release/gode-tekster.exe -Force

      - name: Pak installeren
        run: npx tauri bundle --bundles nsis

      - name: Gem installeren
        id: installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-usigneret
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Signér installeren (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: gode-tekster
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: signeret-installer

      - name: Gem det signerede
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: gode-tekster-signeret
          path: |
            signeret-exe/gode-tekster.exe
            signeret-installer/*.exe
          if-no-files-found: error
