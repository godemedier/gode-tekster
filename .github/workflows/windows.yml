# Windows-udgaven kan bygges her, fra den offentlige kode. I dag bygges der usigneret: SignPath
# Foundation afviste ansøgningen om gratis kodesignering 16/10 (ADR-0057). Godkendes den senere,
# signeres exe'en først, så pakkes installeren om den, og til sidst signeres installeren. Uden
# SIGNPATH_API_TOKEN springes signeringen over, så bygget kan efterprøves.
#
# Kør: et tag v* (fx v0.2.16) eller »Run workflow« på GitHub.
# Opdateringens minisign-signatur laves ikke her: nøglen bliver hos udgiveren (scripts/udgiv.mjs).
#
# Hver action er pinnet til en fuld commit-SHA med versionen som kommentar: et tag kan flyttes,
# en SHA kan ikke. Opdatér begge dele samtidig.

name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Afhængigheder
        run: npm ci

      - name: Byg programmet
        run: npx tauri build --no-bundle

      - name: Gem den usignerede exe
        id: exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exe-usigneret
          path: src-tauri/target/release/gode-tekster.exe
          if-no-files-found: error

      - name: Signér exe'en (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: gode-tekster
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: signeret-exe

      - name: Læg den signerede exe ind i bygget
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item signeret-exe/gode-tekster.exe src-tauri/target/release/gode-tekster.exe -Force

      - name: Pak installeren
        run: npx tauri bundle --bundles nsis

      - name: Gem installeren
        id: installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-usigneret
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Signér installeren (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: gode-tekster
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: signeret-installer

      - name: Gem det signerede
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gode-tekster-signeret
          path: |
            signeret-exe/gode-tekster.exe
            signeret-installer/*.exe
          if-no-files-found: error
