[package]
name = "synk-kerne"
version = "0.1.0"
description = "Gode Tekster: stiregler, protokol og lager til synkroniseringen (ADR-0054)"
authors = ["Gode Medier"]
license = "GPL-3.0-only"
edition = "2021"

[features]
# Serverens lager (SQLite + blobs). Pc'en og telefonen bruger det kun i simulationstesten.
store = ["dep:rusqlite", "dep:getrandom"]

[dependencies]
serde = { version = "1", features = ["derive"] }
blake3 = "1.8.7"
unicode-normalization = "0.1"
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
getrandom = { version = "0.3.4", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
