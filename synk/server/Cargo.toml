[package]
name = "synk-server"
version = "0.1.0"
description = "Gode Tekster: synkserveren (synk.godemedier.dk, ADR-0054)"
authors = ["Gode Medier"]
license = "GPL-3.0-only"
edition = "2021"

[dependencies]
synk-kerne = { path = "../kerne", features = ["store"] }
axum = "0.8"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
ureq = { version = "3.4.2", default-features = false, features = ["json"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
